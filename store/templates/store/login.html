<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Shrii Store</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: #1f1f1f;
            color: white;
            padding: 18px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 32px;
            font-weight: bold;
        }

        .logo-shrii {
            color: white;
        }

        .logo-store {
            color: #f5b52b;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
        }

        nav a:hover {
            color: #f5b52b;
        }

        .container {
            width: 100%;
            max-width: 450px;
            margin: 70px auto;
            padding: 0 20px;
        }

        .login-box {
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        .login-box h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #222;
        }

        .login-box > p {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #f5b52b;
        }

        .login-btn {
            width: 100%;
            padding: 13px;
            background: #222;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #444;
        }

        .message {
            background: #ffe5e5;
            color: #c00;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            text-align: center;
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
        }

        .register-link a {
            color: #d99a00;
            text-decoration: none;
            font-weight: bold;
        }

        footer {
            margin-top: auto;
            background: #1f1f1f;
            color: white;
            text-align: center;
            padding: 18px;
        }

        @media (max-width: 600px) {
            header {
                flex-direction: column;
                gap: 15px;
            }

            nav a {
                margin-left: 10px;
                margin-right: 10px;
            }
        }
    </style>
</head>

<body>

<header>

    <div class="logo">
        <span class="logo-shrii">Shrii</span>
        <span class="logo-store">Store</span>
    </div>

    <nav>
        <a href="{% url 'home' %}">Home</a>
        <a href="{% url 'product_list' %}">Products</a>
        <a href="{% url 'cart' %}">Cart</a>
        <a href="{% url 'register' %}">Register</a>
    </nav>

</header>


<div class="container">

    <div class="login-box">

        <h1>Welcome Back</h1>

        <p>Login to your Shrii Store account</p>


        {% if messages %}
            {% for message in messages %}
                <div class="message">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}


        <form method="POST">

            {% csrf_token %}

            <div class="form-group">
                <label>Username</label>

                <input
                    type="text"
                    name="username"
                    placeholder="Enter username"
                    required
                >
            </div>


            <div class="form-group">
                <label>Password</label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter password"
                    required
                >
            </div>


            <button type="submit" class="login-btn">
                Login
            </button>

        </form>


        <div class="register-link">
            Don't have an account?
            <a href="{% url 'register' %}">Create Account</a>
        </div>

    </div>

</div>


<footer>
    <p>© 2026 Shrii Store. All Rights Reserved.</p>
</footer>

</body>
</html>
